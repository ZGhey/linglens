<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linglens — Settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <header class="masthead">
      <img src="../icons/icon-48.png" alt="" />
      <div>
        <h1>Linglens</h1>
        <p class="tagline" data-i18n="appTagline"></p>
      </div>
      <span id="connection" class="connection" role="status"></span>
    </header>

    <!-- Toolbar popup, not set up yet: setup runs in a tab, because the popup
         closes as soon as focus moves to Google's sign-in page. -->
    <div id="setupCta" class="card featured" hidden>
      <h2 data-i18n="setupCtaTitle"></h2>
      <p class="lede" data-i18n="setupCtaLede"></p>
      <button id="openSetup" type="button" class="btn block cta" data-i18n="setupCtaButton"></button>
    </div>

    <section id="onboarding" hidden aria-labelledby="onboardingTitle">
      <div class="setup-intro">
        <h2 id="onboardingTitle" data-i18n="onboardingTitle"></h2>
        <p data-i18n="onboardingLede"></p>
      </div>

      <div class="card featured">
        <h2><span data-i18n="geminiCardTitle"></span> <span class="badge" data-i18n="recommended"></span></h2>
        <p class="lede" data-i18n="geminiCardLede"></p>
        <ol class="steps">
          <li>
            <button id="openAiStudio" type="button" class="btn" data-i18n="openAiStudio"></button>
          </li>
          <li data-i18n="geminiStep2"></li>
          <li>
            <span data-i18n="geminiStep3"></span>
            <input id="geminiKey" type="password" autocomplete="off" placeholder="AIza…" data-i18n-aria="geminiKeyLabel" />
          </li>
        </ol>
        <p id="geminiStatus" class="hint" role="status" aria-live="polite"></p>
        <p class="note" data-i18n="geminiPrivacy"></p>
      </div>

      <div class="option-list">
        <div class="option">
          <div class="option-head">
            <div>
              <h3 data-i18n="openRouterTitle"></h3>
              <p data-i18n="openRouterLede"></p>
            </div>
            <button id="connectOpenRouter" type="button" class="btn secondary" data-i18n="connect"></button>
          </div>
          <p id="openrouterStatus" class="hint" role="status" aria-live="polite"></p>
        </div>
        <div class="option">
          <div class="option-head">
            <div>
              <h3 data-i18n="haveKeyTitle"></h3>
              <p data-i18n="haveKeyLede"></p>
            </div>
            <button id="showManual" type="button" class="btn secondary" data-i18n="enterKey"></button>
          </div>
        </div>
      </div>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab" id="tab-btn-settings" type="button" role="tab" aria-selected="true" data-i18n="tabSettings"></button>
      <button class="tab" id="tab-btn-history" type="button" role="tab" aria-selected="false" data-i18n="tabHistory"></button>
    </div>

    <div id="tab-settings" class="tab-panel" role="tabpanel">
      <section class="group">
        <h2 class="group-title" data-i18n="groupModel"></h2>
        <div class="card">
          <div class="field">
            <label for="provider" data-i18n="provider"></label>
            <select id="provider"></select>
            <!-- Provider-specific shortcut: get a free Gemini key, or connect
                 OpenRouter without copying a key. -->
            <div id="providerAssist" class="assist" hidden>
              <p id="assistText"></p>
              <button id="assistAction" type="button" class="btn secondary"></button>
            </div>
          </div>

          <div class="field" id="baseUrlField">
            <label for="baseUrl" id="baseUrlLabel" hidden data-i18n="baseUrl"></label>
            <input id="baseUrl" autocomplete="off" placeholder="https://host/v1" hidden />
            <p class="hint" id="baseUrlHint" hidden data-i18n="baseUrlHint"></p>
          </div>

          <div class="field">
            <label for="model" data-i18n="model"></label>
            <select id="model"></select>
            <input id="modelCustom" autocomplete="off" placeholder="e.g. gemini-3.1-flash-lite" hidden />
            <p class="hint" id="modelCustomHint" hidden data-i18n="modelCustomHint"></p>
          </div>

          <div class="field">
            <label for="apiKey" data-i18n="apiKey"></label>
            <input id="apiKey" type="password" autocomplete="off" placeholder="sk-…" />
            <p class="hint" id="keyHint"></p>
            <p class="hint" id="assistStatus" role="status" aria-live="polite"></p>
          </div>

          <p class="note" data-i18n="freeTierNote"></p>
        </div>
      </section>

      <section class="group">
        <h2 class="group-title" data-i18n="groupExplanations"></h2>
        <div class="card">
          <div class="field">
            <label for="lang" data-i18n="language"></label>
            <select id="lang"></select>
            <input id="langCustom" autocomplete="off" placeholder="e.g. Italiano, 日本語" hidden data-i18n-aria="customLanguage" />
          </div>
          <div class="field">
            <label for="verbosity" data-i18n="length"></label>
            <select id="verbosity">
              <option value="concise" data-i18n="lengthConcise"></option>
              <option value="detailed" data-i18n="lengthDetailed"></option>
            </select>
          </div>
        </div>
      </section>

      <section class="group">
        <h2 class="group-title" data-i18n="groupPdfs"></h2>
        <div class="card">
          <label class="switch-row" for="pdfReader">
            <span data-i18n="pdfReaderToggle"></span>
            <input id="pdfReader" type="checkbox" role="switch" />
          </label>
          <p class="hint" data-i18n="pdfReaderHint"></p>
        </div>
      </section>

      <div class="savebar">
        <button id="save" type="button" class="btn" data-i18n="saveChanges"></button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </div>

    <div id="tab-history" class="tab-panel" role="tabpanel" hidden>
      <div class="history-head">
        <div class="field">
          <label for="historyLimit" data-i18n="keepLast"></label>
          <input id="historyLimit" type="number" min="1" max="1000" step="1" />
        </div>
        <p class="hint" data-i18n="historyHint"></p>
      </div>
      <div id="history"></div>
      <button id="clearHistory" type="button" class="btn ghost" hidden data-i18n="clearHistory"></button>
    </div>

    <p class="colophon">
      <span data-i18n="openSource"></span> ·
      <a href="https://github.com/ZGhey/linglens" target="_blank" rel="noreferrer">GitHub</a>
      ·
      <a href="https://github.com/ZGhey/linglens/blob/main/PRIVACY.md" target="_blank" rel="noreferrer" data-i18n="privacy"></a>
    </p>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
